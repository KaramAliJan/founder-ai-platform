version: "3.9"

services:
  react:
    build: 
     context: ./frontend
     dockerfile: ../Dockerfile.frontend
    container_name: react
    ports:
      - "3000:3000"
    depends_on:
      - fastapi
    volumes:
      - ./frontend:/app
    stdin_open: true
    tty: true

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: cache_container
    ports:
      - "6379:6379"

  fastapi:
    build: 
      context: ./backend
      dockerfile: ../Dockerfile.backend

    container_name: fastapi
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://appuser:secretpassword@postgres:5432/mydb
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app


volumes:
  postgres_data: